name: nsw_transit
description: Plan trips on NSW buses, trains, ferries and metro with live arrivals and vehicle tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  gtfs_realtime_bindings: ^1.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png

# Regenerate with: python tool/make_logo.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#0B1F4A"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
